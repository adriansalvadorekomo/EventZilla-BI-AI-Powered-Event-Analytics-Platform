# Static app + the API proxy. Runs unprivileged (port 8080).
# 10 analyst questions a minute per address, a few more allowed in a burst; everything else is not limited here.
limit_req_zone $binary_remote_addr zone=ask:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 4k;                 # a question is at most 500 characters

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /api/ask {
        limit_req zone=ask burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # set, never appended: a client cannot forge it
        proxy_read_timeout 90s;            # the analyst can take several seconds
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }

    location ~ /\. { deny all; }          # no dotfiles

    location ~* \.(js|css|woff2?|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;   # add_header here replaces the ones above
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
