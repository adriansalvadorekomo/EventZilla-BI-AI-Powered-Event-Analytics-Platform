# Tooling configuration for the platform's Python (ingestion, orchestration, quality, analytics, backend).
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "ml/notebooks", "*.ipynb"]

[tool.ruff.lint.isort]
known-first-party = ["app", "common"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "ISC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "S608"]   # pytest asserts; the security tests build hostile SQL on purpose

[tool.bandit]
# Every severity counts; nothing is skipped globally. A finding is either fixed or justified inline (# nosec Bxxx).
# tests use assert by design (pytest); scanning them only reports B101 noise
exclude_dirs = ["frontend", "ml/notebooks", "node_modules", ".venv", "backend/tests"]
